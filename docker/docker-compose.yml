version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmp_user
      POSTGRES_PASSWORD: pmp_password
      POSTGRES_DB: pmp_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
