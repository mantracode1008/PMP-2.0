name: Deploy PMP to VPS

on:
  push:
    branches:
      - main
      - master
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via Native SSH
        env:
          VPS_HOST: "145.223.22.204"
          VPS_USER: "root"
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          echo "🔑 Setting up SSH connection to $VPS_HOST..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          if [ -n "$VPS_SSH_KEY" ]; then
            echo "Using SSH Key Authentication..."
            echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            SSH_CMD="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_rsa $VPS_USER@$VPS_HOST"
          else
            echo "Using Password Authentication..."
            sudo apt-get update -y && sudo apt-get install -y sshpass
            SSH_CMD="sshpass -p '$VPS_PASSWORD' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 $VPS_USER@$VPS_HOST"
          fi

          echo "🚀 Executing Deployment on VPS..."
          $SSH_CMD << 'ENDSSH'
            set -e
            DEPLOY_DIR="/var/www/pmp"
            mkdir -p $DEPLOY_DIR

            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "📦 Cloning Repository..."
              git clone https://github.com/mantracode1008/PMP-2.0.git $DEPLOY_DIR
              cd $DEPLOY_DIR
            else
              echo "🔄 Pulling latest code..."
              cd $DEPLOY_DIR
              git fetch origin
              git checkout main || true
              git reset --hard origin/main
            fi

            chmod +x deploy.sh
            ./deploy.sh
          ENDSSH
